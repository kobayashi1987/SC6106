
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Store Money</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">

        <h2>Store Money</h2>

        <input
            type="text"
            id="depositor"
            placeholder="Enter depositor address">

        <input
            type="number"
            id="amount"
            min="1"
            step="1"
            placeholder="Enter amount to store">

        <button class="btn" onclick="storeMoney()">
            Store
        </button>

        <button class="btn" onclick="depositView()">
            View Deposit
        </button>

        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>

        <p id="view_depositor"></p>
        <p id="view_amount"></p>
        <p id="status"></p>

        <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>

        <script>
            const contractAddress =
                "0x596F672F9E0Ebddf976Bf6bB697B39cb72815dF2";

            const contractABI = [
                                    {
                                        "inputs": [
                                        {
                                            "internalType": "address",
                                            "name": "_depositor",
                                            "type": "address"
                                        },
                                        {
                                            "internalType": "uint256",
                                            "name": "_amount",
                                            "type": "uint256"
                                        }
                                        ],
                                        "name": "deposit_money",
                                        "outputs": [],
                                        "stateMutability": "nonpayable",
                                        "type": "function"
                                    },
                                    {
                                        "inputs": [],
                                        "name": "deposit_view",
                                        "outputs": [
                                        {
                                            "internalType": "address",
                                            "name": "",
                                            "type": "address"
                                        },
                                        {
                                            "internalType": "uint256",
                                            "name": "",
                                            "type": "uint256"
                                        }
                                        ],
                                        "stateMutability": "view",
                                        "type": "function"
                                    }
                                    ]


            const web3 = new Web3(Web3.givenProvider);
            const contract = new web3.eth.Contract(contractABI, contractAddress);

            // Store Money function
            async function storeMoney() {
                try {
                    if (!web3) {
                        throw new Error("MetaMask is not installed.");
                    }

                    const accounts = await web3.eth.requestAccounts();

                    const depositor =
                        document.getElementById('depositor').value.trim();

                    const amount =
                        document.getElementById('amount').value.trim();

                    if (!web3.utils.isAddress(depositor)) {
                        throw new Error("Invalid depositor address.");
                    }

                    if (!/^[1-9][0-9]*$/.test(amount)) {
                        throw new Error("Enter a positive integer amount.");
                    }

                    if (BigInt(amount) >= (1n << 256n)) {
                        throw new Error("Amount exceeds uint256 limit.");
                    }

                    console.log("Depositor:", depositor);
                    console.log("Amount:", amount);
                    console.log("Account:", accounts[0]);

                    const receipt = await contract.methods
                        .deposit_money(depositor, amount)
                        .send({
                            from: accounts[0]
                        });

                    console.log("Transaction:", receipt);

                    document.getElementById('status').innerText =
                        "Store transaction successful!";

                    await depositView();

                } catch (error) {
                    console.error("Store Error:", error);

                    document.getElementById('status').innerText =
                        "Error: " + error.message;
                }
            }

            // View stored deposit
            async function depositView() {
                try {
                    if (!contract) {
                        throw new Error("MetaMask is not installed.");
                    }

                    const result = await contract.methods
                        .deposit_view()
                        .call();

                    document.getElementById('view_depositor').innerText =
                        "Depositor: " + result[0];

                    document.getElementById('view_amount').innerText =
                        "Amount: " + result[1];

                } catch (error) {
                    console.error("View Error:", error);

                    document.getElementById('status').innerText =
                        "Error: " + error.message;
                }
            }
        </script>

    </div>
</body>
</html>
