
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Store Money</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">

        <h2>Store Money</h2>

        <input type="text"
               id="depositor"
               placeholder="Enter depositor address">

        <input type="number"
               id="amount"
               placeholder="Enter amount to store">

        <button class="btn" onclick="storeMoney()">Store</button>

        <button class="btn" onclick="transaction()">Transaction</button>

        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>

        <p id="view_depositor"></p>
        <p id="view_amount"></p>

        <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>

        <script>
            const contractAddress =
                "0x596F672F9E0Ebddf976Bf6bB697B39cb72815dF2";

            const contractABI = [
                {
                    "inputs": [
                        {
                            "internalType": "address",
                            "name": "_depositor",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "_amount",
                            "type": "uint256"
                        }
                    ],
                    "name": "deposit_money",
                    "outputs": [],
                    "stateMutability": "nonpayable",
                    "type": "function"
                },
                {
                    "inputs": [],
                    "name": "deposit_view",
                    "outputs": [
                        {
                            "internalType": "address",
                            "name": "",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "",
                            "type": "uint256"
                        }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                }
            ];

            const web3 = new Web3(Web3.givenProvider);
            const contract = new web3.eth.Contract(
                contractABI,
                contractAddress
            );

            // Store Money function
            async function storeMoney() {

                const accounts = await web3.eth.requestAccounts();

                const depositor =
                    document.getElementById('depositor').value;

                const amount =
                    document.getElementById('amount').value;

                console.log(depositor, amount);
                console.log("accounts[0] " + accounts[0]);

                await contract.methods
                    .deposit_money(depositor, amount)
                    .send({ from: accounts[0] });
            }

            // Transaction function
            async function transaction() {

                const result = await contract.methods
                    .deposit_view()
                    .call();

                document.getElementById('view_depositor').innerText =
                    "Depositor: " + result[0];

                document.getElementById('view_amount').innerText =
                    "Amount: " + result[1];
            }

        </script>

    </div>
</body>

</html>
